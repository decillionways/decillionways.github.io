<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Ferrdins</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #18181b; --muted: #52525b; --card: #fff; --line: #e4e4e7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --card: #18181b; --line: #27272a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; }
  h1 { font-size: 1.75rem; margin: 0 0 2rem; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem 1.25rem; }
  h2 { font-size: 1.1rem; margin: 0 0 .25rem; }
  p { margin: 0; color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
<h1>Apps by Ferrdins</h1>
<ul>
  <li><h2>Andromeda Media Handler</h2><p>Edit videos, photos, designs and audio on your device. Works offline. Coming soon.</p></li>
</ul>
</main>
</body>
</html>
